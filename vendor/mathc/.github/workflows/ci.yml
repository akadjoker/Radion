name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.compiler }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: GCC
            cxx: g++
          - compiler: Clang
            cxx: clang++
    env:
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install --yes libglm-dev ninja-build
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DMATHC_BUILD_BENCH=OFF -DMATHC_NATIVE_ARCH=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: Address and undefined behavior sanitizers
    runs-on: ubuntu-latest
    env:
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install --yes clang libglm-dev ninja-build
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DMATHC_BUILD_BENCH=OFF -DMATHC_NATIVE_ARCH=OFF
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ASAN_OPTIONS=detect_leaks=1 ctest --test-dir build --output-on-failure

  distribution:
    name: Single-header distribution is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate the distribution header
        run: python3 tools/amalgamate.py
      - name: Check for uncommitted generated output
        run: git diff --exit-code -- dist/mathc.h
